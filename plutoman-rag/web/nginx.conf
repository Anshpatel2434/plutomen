server {
  listen 80;
  root /usr/share/nginx/html;

  # API: strip the /api prefix and forward to the api service.
  location /api/ {
    # Resolve "api" through Docker's DNS at request time (cached 10 s), not
    # once at start-up: a rebuilt or restarted api container gets a new IP,
    # and a start-up lookup would keep proxying to the old one (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Generated answers on a CPU-only Ollama can take minutes.
    proxy_read_timeout 900s;
    client_max_body_size 25m;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
